# For bare-metal / VPS deployment (not Docker)
# Place in /etc/nginx/sites-available/brahmastra
# ln -s /etc/nginx/sites-available/brahmastra /etc/nginx/sites-enabled/

upstream brahmastra_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name brahmastra.local;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    root /opt/brahmastra/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://brahmastra_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reports {
        proxy_pass http://brahmastra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
